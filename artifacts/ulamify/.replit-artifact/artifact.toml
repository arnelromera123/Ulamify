kind = "web"
previewPath = "/"
title = "Ulamify POS"
description = "An offline-first POS and daily operations suite for Filipino karinderya teams, designed for fast cashier checkout, kitchen production, purchasing, and owner oversight."
version = "1.0.0"
id = "artifacts/ulamify"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18993

[services.development]
run = "pnpm --filter @workspace/ulamify run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ulamify", "run", "build" ]
serve = "static"
publicDir = "artifacts/ulamify/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18993"
BASE_PATH = "/"
