        baseUnit:
          $ref: "#/components/schemas/InventoryBaseUnit"
        quantityAvailable:
          type: number
          minimum: 0
        latestUnitCost:
          type: number
          minimum: 0
    InventoryIngredientInput:
      type: object
      required: [name, baseUnit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        baseUnit:
          $ref: "#/components/schemas/InventoryBaseUnit"
    InventoryReceiptInput:
      type: object
      required: [ingredientId, quantity, unit, totalCost]
      properties:
        ingredientId:
          type: integer
          minimum: 1
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          $ref: "#/components/schemas/InventoryPurchaseUnit"
        totalCost:
          type: number
