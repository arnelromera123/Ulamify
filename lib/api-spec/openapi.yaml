        amount:
          type: number
        createdAt:
          type: string
        category:
          type: ["string", "null"]
          enum: [ingredients, supplies, delivery, other, null]
        supplier:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
    RecipeIngredient:
